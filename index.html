<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sriyaan Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#eceef2; --line:#e0e3e9; --line-2:#cfd4dc;
  --text:#131720; --muted:#566072; --faint:#8a92a2;
  --accent:#0d7a6c; --accent-2:#0a6558; --accent-soft:#d8f1ec; --on-accent:#ffffff;
  --danger:#d33a3f; --danger-soft:#fde8e8; --warn-soft:#fff4d6;
  --k-pdf:#e0474c; --k-doc:#3d63dd; --k-sheet:#2c9a5f; --k-slides:#ea6a1c; --k-image:#8a4cc4; --k-video:#d13f98; --k-text:#5d6a7b; --k-archive:#bf8500;
  --paper:#ffffff; --paper-ink:#2a2f38; --stage:#e7e9ee;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -8px rgba(16,24,40,.14);
  --shadow-lg:0 24px 60px -12px rgba(10,14,22,.35);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c0e12; --panel:#14171d; --panel-2:#1b1f27; --line:#252a34; --line-2:#323846;
  --text:#e8ebf1; --muted:#a1a8b7; --faint:#6d7485;
  --accent:#3fd3bf; --accent-2:#66e0cf; --accent-soft:#0e3530; --on-accent:#032019;
  --danger:#ff6b6f; --danger-soft:#3a1719; --warn-soft:#352a0c;
  --k-pdf:#ff6b6f; --k-doc:#7f9cff; --k-sheet:#4cc98a; --k-slides:#ff9350; --k-image:#b98bf0; --k-video:#f06fbf; --k-text:#98a3b3; --k-archive:#f0b730;
  --paper:#f4f5f7; --paper-ink:#23272f; --stage:#0f1115;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -8px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0e12; --panel:#14171d; --panel-2:#1b1f27; --line:#252a34; --line-2:#323846;
  --text:#e8ebf1; --muted:#a1a8b7; --faint:#6d7485;
  --accent:#3fd3bf; --accent-2:#66e0cf; --accent-soft:#0e3530; --on-accent:#032019;
  --danger:#ff6b6f; --danger-soft:#3a1719; --warn-soft:#352a0c;
  --k-pdf:#ff6b6f; --k-doc:#7f9cff; --k-sheet:#4cc98a; --k-slides:#ff9350; --k-image:#b98bf0; --k-video:#f06fbf; --k-text:#98a3b3; --k-archive:#f0b730;
  --paper:#f4f5f7; --paper-ink:#23272f; --stage:#0f1115;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;overflow:auto;padding:20px 14px 18px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand b{font:600 19px/1.1 var(--display);letter-spacing:-.02em;display:block}
.brand small{color:var(--faint);font-size:12px}
.up-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s,background .15s}
.up-btn:hover{background:var(--accent-2);transform:translateY(-1px)}
.up-btn:active{transform:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin:6px 0 4px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.nav-h button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.nav-h button:hover{background:var(--panel-2);color:var(--text)}
.nav-h svg.i{width:16px;height:16px}
.ni{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%;transition:background .12s,color .12s}
.ni:hover{background:var(--panel-2);color:var(--text)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.ni .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.ni[aria-current="page"] .n{color:var(--accent)}
.ni .dot{width:10px;height:10px;border-radius:3px;flex:none;margin:0 5px}
.ni.drop-over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.ni .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.storage{margin-top:auto;padding:14px 12px;border-radius:12px;background:var(--panel-2)}
.storage .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.storage b{font-weight:600;font-size:13px}
.meter{height:6px;border-radius:3px;background:var(--line);margin:10px 0 8px;overflow:hidden;display:flex}
.meter i{height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.legend span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}

.main{min-width:0;padding:0 28px 80px}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:16px 0 12px;background:var(--bg)}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.only-m{display:none}
.search{flex:1;max-width:640px;display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--faint);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search kbd{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--faint)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--panel-2);margin-left:auto}
.seg .icon-btn{width:36px;height:34px;border-radius:9px}
.me{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;background:var(--panel-2);display:grid;place-items:center;font-weight:600;color:var(--muted)}
.me img{width:100%;height:100%;object-fit:cover}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--text);margin:4px 0 8px;font-size:13px}
.notice svg{margin-top:1px;color:var(--muted)}

.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px 0 14px}
.head .crumb{color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.head .crumb .dot{width:9px;height:9px;border-radius:3px}
.head h1{font:600 clamp(28px,4vw,38px)/1.05 var(--display);letter-spacing:-.025em;text-wrap:balance}
.head .meta{color:var(--muted);margin-top:8px}
.head .acts{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:13px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn svg.i{width:17px;height:17px}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:500;font-size:13px;transition:all .12s}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.7}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.sort select{height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 10px;color:var(--text)}

.bulk{position:sticky;top:74px;z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 8px 8px 16px;margin-bottom:14px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:var(--shadow)}
.bulk b{font-weight:600;margin-right:auto}
.bulk .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.bulk .btn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}

/* ---------- Folders strip ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:28px}
.fcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.fcard.drop-over{border-color:var(--accent);background:var(--accent-soft)}
.fcard .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.fcard b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard small{color:var(--faint)}
.fcard div{min-width:0}
.fcard.new{border-style:dashed;color:var(--muted);background:transparent}
.fcard.new .fi{background:var(--panel-2);color:var(--muted)}

/* ---------- File grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.card{position:relative;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s;display:flex;flex-direction:column;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.dragging{opacity:.5}
.thumb{--c:var(--k-text);position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--c) 11%,var(--panel-2));overflow:hidden;display:grid;place-items:center;max-width:100%}
.thumb>img,.thumb>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .sheet{position:absolute;inset:16px 18px auto;height:calc(100% + 6px);background:var(--paper);border-radius:7px 7px 0 0;box-shadow:0 2px 10px rgba(0,0,0,.14);overflow:hidden;transition:transform .25s ease}
.card:hover .thumb .sheet{transform:translateY(-4px)}
.thumb .sheet img{width:100%;display:block}
.thumb .sheet pre{margin:0;padding:12px 12px;font:9px/1.45 var(--mono);color:var(--paper-ink);white-space:pre-wrap;word-break:break-word}
.thumb .glyph{color:var(--c);display:grid;place-items:center;gap:8px;transition:transform .25s}
.card:hover .thumb .glyph{transform:scale(1.06) rotate(-2deg)}
.thumb .glyph svg{width:62px;height:74px}
.badge{position:absolute;left:10px;bottom:10px;z-index:2;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:6px;background:var(--c);color:#fff}
.k-pdf{--c:var(--k-pdf)}.k-doc{--c:var(--k-doc)}.k-sheet{--c:var(--k-sheet)}.k-slides{--c:var(--k-slides)}.k-image{--c:var(--k-image)}.k-video{--c:var(--k-video)}.k-text{--c:var(--k-text)}.k-archive{--c:var(--k-archive)}
.pick,.cstar{position:absolute;top:10px;z-index:3;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);color:var(--muted);opacity:0;transition:opacity .15s,background .15s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pick{left:10px}.cstar{right:10px}
.pick svg.i,.cstar svg.i{width:17px;height:17px}
.card:hover .pick,.card:hover .cstar,.card:focus-within .pick,.card:focus-within .cstar,.selecting .pick{opacity:1}
.card.sel .pick{background:var(--accent);color:var(--on-accent);opacity:1}
.cstar.on{opacity:1;color:#e8a400}
.cstar.on svg.i{fill:#f5b800;stroke:#e0a100}
.cbody{padding:12px 14px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{color:var(--faint);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.cfoot{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:4px;min-width:0}
.cfoot .dot{width:8px;height:8px;border-radius:2px;flex:none}
.cfoot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--panel-2);color:var(--muted)}

/* ---------- List view ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table.files{width:100%;border-collapse:collapse;min-width:760px}
.files th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 14px;border-bottom:1px solid var(--line)}
.files td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);white-space:nowrap}
.files tr:last-child td{border-bottom:0}
.files tbody tr{cursor:pointer;transition:background .1s}
.files tbody tr:hover{background:var(--panel-2)}
.files tr.sel{background:var(--accent-soft)}
.files .nmcell{display:flex;align-items:center;gap:12px;color:var(--text);font-weight:600;max-width:380px}
.files .nmcell span{overflow:hidden;text-overflow:ellipsis}
.ficon{--c:var(--k-text);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font:600 8.5px/1 var(--mono);letter-spacing:.02em}
.cb{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line-2);display:grid;place-items:center;color:transparent}
.sel .cb{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb svg.i{width:14px;height:14px;stroke-width:2.6}

/* ---------- Empty / dropzone ---------- */
.dropzone{display:grid;place-items:center;text-align:center;gap:14px;padding:56px 20px;border:2px dashed var(--line-2);border-radius:20px;background:var(--panel);color:var(--muted);transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--accent)}
.dropzone .big{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.dropzone .big svg.i{width:30px;height:30px}
.dropzone h2{font:600 22px/1.2 var(--display);color:var(--text);letter-spacing:-.015em}
.dropzone p{max-width:48ch}
.types{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.types span{font:500 11px/1 var(--mono);padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.loading{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.skel{border-radius:16px;height:250px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel-2) 50%,var(--panel) 70%);background-size:300% 100%;animation:sh 1.3s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-150% 0}}

/* ---------- Drop overlay ---------- */
.drop{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--accent) 16%,rgba(8,10,14,.55));backdrop-filter:blur(3px);display:grid;place-items:center;pointer-events:none}
.drop div{padding:36px 48px;border-radius:24px;background:var(--panel);border:2px dashed var(--accent);text-align:center;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.drop b{display:block;font:600 24px/1.2 var(--display);margin:12px 0 4px}
.drop svg.i{width:40px;height:40px;margin:0 auto;color:var(--accent)}
@keyframes pop{from{transform:scale(.94);opacity:0}}

/* ---------- Upload tray ---------- */
.tray{position:fixed;right:20px;bottom:20px;z-index:70;width:min(380px,calc(100% - 32px));border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease}
.tray-h{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 16px;background:var(--text);color:var(--bg);font-weight:600}
.tray-h .icon-btn{width:32px;height:32px;color:var(--bg);margin-left:auto}
.tray-h .icon-btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.tray ul{list-style:none;margin:0;padding:6px 0;max-height:260px;overflow:auto}
.tray li{display:flex;align-items:center;gap:12px;padding:8px 16px}
.tray li .t{flex:1;min-width:0}
.tray li b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray li small{color:var(--faint);font-size:12px}
.tray li small.err{color:var(--danger)}
.spin{width:18px;height:18px;border-radius:50%;border:2.4px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{color:var(--accent)}.bad{color:var(--danger)}

/* ---------- Viewer ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:rgba(6,8,12,.72);backdrop-filter:blur(6px);display:flex;padding:18px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.vbox{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);border-radius:20px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-lg);max-width:1500px;margin:0 auto;width:100%}
.vtop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.vtop .ficon{width:34px;height:34px}
.vtop h2{font:600 16px/1.2 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vtop .sp{flex:1}
.vtop .pos{color:var(--faint);margin-right:4px}
.stage{position:relative;background:var(--stage);overflow:auto;min-height:0}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Icons ---------- */

const docGlyph = ext => `<svg viewBox="0 0 62 74" aria-hidden="true"><path d="M8 2h32l20 20v44a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" fill="var(--panel)" stroke="currentColor" stroke-width="2.4"/><path d="M40 2v14a6 6 0 0 0 6 6h14" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="10" y="42" width="42" height="18" rx="4" fill="currentColor"/><text x="31" y="55" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="10" fill="#fff">${esc(ext.toUpperCase().slice(0,4))}</text></svg>`;

/* ---------- File types ---------- */
const MB = 1048576;
const EXT = {

  png:{kind:"image",mime:"image/png",native:true}, jpg:{kind:"image",mime:"image/jpeg",native:true}, jpeg:{kind:"image",mime:"image/jpeg",native:true},

const FILTERS = [
  {key:"all",label:"All"},{key:"pdf",label:"PDFs",kinds:["pdf"]},{key:"doc",label:"Docs",kinds:["doc","text"]},
  {key:"sheet",label:"Sheets",kinds:["sheet"]},{key:"slides",label:"Slides",kinds:["slides"]},
  {key:"image",label:"Images",kinds:["image"]},{key:"video",label:"Videos",kinds:["video"]},{key:"archive",label:"Zips",kinds:["archive"]}
];
const FOLDER_COLORS = ["#e0474c","#ea6a1c","#d99a00","#2c9a5f","#0d9488","#3d63dd","#8a4cc4","#d13f98","#64748b"];
document.getElementById("fileInput").accept = Object.keys(EXT).map(e => "." + e).join(",");

/* ---------- Formatting ---------- */
const fmtSize = b => b < 1024 ? b + " B" : b < MB ? (b/1024).toFixed(b < 10240 ? 1 : 0) + " KB" : b < 1024*MB ? (b/MB).toFixed(1) + " MB" : (b/1024/MB).toFixed(2) + " GB";
const rtf = new Intl.RelativeTimeFormat("en", {numeric:"auto"});
function ago(ts){
  const s = (ts - Date.now())/1000, a = Math.abs(s);
  if (a < 60) return "just now";
  if (a < 3600) return rtf.format(Math.round(s/60), "minute");
  if (a < 86400) return rtf.format(Math.round(s/3600), "hour");
  if (a < 86400*7) return rtf.format(Math.round(s/86400), "day");
  const d = new Date(ts), o = {month:"short", day:"numeric"};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleDateString("en-US", o);
}
const fullDate = ts => new Date(ts).toLocaleString("en-US",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/-/g,"").slice(0,20);

const extOf = n => (n.split(".").pop() || "").toLowerCase();

/* ---------- State ---------- */
const S = {files:[], folders:[], ready:false, view:"all", folderId:null, q:"", filter:"all", sort:"new", layout:"grid", selected:new Set(), openId:null};

const people = {};

/* ---------- Store (shared db, or in-tab fallback) ---------- */
const store = {
  async setFile(id, data){ if (local){ S.files.push({id, ...data}); render(); return; } await db.doc("files/" + id).set(data); },
  async updateFile(id, patch){
    if (local){ Object.assign(S.files.find(f => f.id === id) || {}, patch); render(); return; }

  },
  async delFile(id){ if (local){ S.files = S.files.filter(f => f.id !== id); render(); return; } await db.doc("files/" + id).delete(); },
  async setFolder(id, data){ if (local){ S.folders.push({id, ...data}); render(); return; } await db.doc("folders/" + id).set(data); },
  async updateFolder(id, patch){ if (local){ Object.assign(S.folders.find(f => f.id === id) || {}, patch); render(); return; } await db.doc("folders/" + id).update(patch); },
  async delFolder(id){ if (local){ S.folders = S.folders.filter(f => f.id !== id); render(); return; } await db.doc("folders/" + id).delete(); }

const canUpload = () => local || !!assets;
const blobUrl = f => f.localUrl || (f.assetId ? "/_blob/" + f.assetId : "");
async function getBlob(f){
  if (f.localBlob) return f.localBlob;
  const r = await fetch(blobUrl(f));
  if (!r.ok) throw Object.assign(new Error("This file is missing from storage."), {code:"missing"});

/* ---------- Lazy libraries ---------- */
const LIBS = {
  pdf:["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],

const GLOBALS = {pdf:()=>window.pdfjsLib, mammoth:()=>window.mammoth, xlsx:()=>window.XLSX, jszip:()=>window.JSZip, marked:()=>window.marked, purify:()=>window.DOMPurify};
const loaded = {};
const loadScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load the previewer.")); document.head.appendChild(s); });
function lib(name){
  return loaded[name] ||= LIBS[name].reduce((p, s) => p.then(() => loadScript(s)), Promise.resolve()).then(() => {
    const g = GLOBALS[name](); if (!g) throw new Error("Previewer unavailable"); return g;

const clean = html => lib("purify").then(P => P.sanitize(html, {FORBID_TAGS:["style","form","input"], FORBID_ATTR:["style"]}));

/* ---------- Derived lists ---------- */
const folderOf = id => S.folders.find(f => f.id === id);
const live = () => S.files.filter(f => !f.trashed);
function visible(){
  let l = S.view === "trash" ? S.files.filter(f => f.trashed) : live();
  if (S.view === "starred") l = l.filter(f => f.starred);
  if (S.view === "folder") l = l.filter(f => f.folderId === S.folderId);
  const flt = FILTERS.find(x => x.key === S.filter);
  if (flt?.kinds) l = l.filter(f => flt.kinds.includes(f.kind));
  if (S.q){
    const terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    l = l.filter(f => { const hay = [f.name, f.ext, f.acc, f.note, KIND_LABEL[f.kind], folderOf(f.folderId)?.name, ...(f.tags||[])].join(" ").toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  const by = {
    new:(a,b)=>b.createdAt-a.createdAt, old:(a,b)=>a.createdAt-b.createdAt,
    name:(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}), size:(a,b)=>b.size-a.size,
    mod:(a,b)=>b.updatedAt-a.updatedAt
  };
  l = [...l].sort(S.view === "recent" ? by.mod : by[S.sort] || by.new);

}

/* ---------- People ---------- */
async function fillPeople(){
  const els = [...document.querySelectorAll("[data-person]")];
  const ids = [...new Set(els.map(e => e.dataset.person).filter(Boolean))];
  if (user && ids.length){
    try { const ps = await user.profiles(ids); Object.assign(people, ps); } catch {}
  }
  els.forEach(e => {
    const id = e.dataset.person, p = people[id];
    if (!id){ e.textContent = local ? "You" : "—"; return; }
    const name = p?.isMe ? "You" : (p?.name || "A teammate");
    if (e.dataset.avatar !== undefined && p?.avatarUrl){
      e.textContent = ""; const img = document.createElement("img"); img.src = p.avatarUrl; img.alt = ""; e.append(img, document.createTextNode(name));
    } else e.textContent = name;
  });
}

/* ---------- Thumbnails ---------- */
let io;
function observeThumbs(){
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); makeThumb(e.target.dataset.thumb); } }), {rootMargin:"200px"});
  document.querySelectorAll("[data-thumb]").forEach(el => { const f = S.files.find(x => x.id === el.dataset.thumb); if (f && !thumbCache.has(f.id) && ["pdf","text","doc","sheet"].includes(f.kind)) io.observe(el); });
}
async function makeThumb(id){
  const f = S.files.find(x => x.id === id); if (!f || thumbCache.has(id)) return;
  thumbCache.set(id, {});
  try {
    let t = null;
    if (f.kind === "pdf"){
      const pdfjs = await lib("pdf");
      const doc = await pdfjs.getDocument(f.localBlob ? {data:new Uint8Array(await f.localBlob.arrayBuffer()), isEvalSupported:false} : {url:blobUrl(f), isEvalSupported:false}).promise;
      const pg = await doc.getPage(1), vp0 = pg.getViewport({scale:1}), scale = 360/vp0.width, vp = pg.getViewport({scale});
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = Math.min(vp.height, vp.width*1.1);
      await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
      t = {img:cv.toDataURL("image/jpeg",.8)}; doc.destroy();
    } else if (f.ext === "docx"){
      const m = await lib("mammoth"); const r = await m.extractRawText({arrayBuffer: await (await getBlob(f)).arrayBuffer()});
      t = {text:r.value.trim().slice(0,700)};
    } else if (f.kind === "text" || f.ext === "csv"){
      const txt = await (await getBlob(f)).text(); t = {text:txt.slice(0,700)};
    }
    if (t){ thumbCache.set(id, t); const el = document.querySelector(`[data-thumb="${id}"]`); if (el){ el.innerHTML = thumbInner(f) + `<span class="badge">${esc(f.ext.toUpperCase())}</span>`; } }
  } catch { /* keep the glyph */ }
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, undo){
  const t = $("#toast"); clearTimeout(toastT);
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ""}`; t.hidden = false;
  if (undo) $("#undoBtn").onclick = () => { t.hidden = true; undo(); };
  toastT = setTimeout(() => t.hidden = true, undo ? 6500 : 3400);
}
function failMsg(e){
  const c = e?.code;
  if (c === "quota_exceeded" || c === "quota_or_state") return "Storage is full. Delete files in Trash to make room.";
  if (c === "rate_limited" || c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  if (c === "invalid_argument" || c === "not_granted") return "You don't have permission to change this archive.";
  if (c === "too_large") return "That file is over the 20 MB limit.";
  return e?.message || "Something went wrong. Try again.";
}

/* ---------- Modal ---------- */
function modal(html, onReady){

  const close = () => { m.hidden = true; m.innerHTML = ""; };
  m.onclick = e => { if (e.target === m || e.target.closest("[data-close]")) close(); };
  onReady?.(m, close);
  setTimeout(() => (m.querySelector("input[type=text]") || m.querySelector(".btn.primary,.btn.danger.solid"))?.focus(), 30);
  return close;
}

function moveDialog(ids){

/* ---------- Actions ---------- */
async function trashFiles(ids){
  const now = Date.now();
  try {
    for (const id of ids) await store.updateFile(id, {trashed:true, trashedAt:now, updatedAt:now});
    S.selected.clear(); render();
    toast(`${ids.length} file${ids.length===1?"":"s"} moved to Trash`, async () => { for (const id of ids) await store.updateFile(id, {trashed:false, updatedAt:Date.now()}); });
  } catch (e){ toast(failMsg(e)); }
}
async function restoreFiles(ids){
  try { for (const id of ids) await store.updateFile(id, {trashed:false, updatedAt:Date.now()}); S.selected.clear(); render(); toast(`Restored ${ids.length} file${ids.length===1?"":"s"}`); }
  catch (e){ toast(failMsg(e)); }
}
async function purgeFiles(ids){
  let n = 0;
  for (const id of ids){
    const f = S.files.find(x => x.id === id); if (!f) continue;
    try {

      if (f.localUrl) URL.revokeObjectURL(f.localUrl);
      await store.delFile(id); n++;

  }

}
async function toggleStar(ids, on){

  catch (e){ toast(failMsg(e)); }
}
async function download(f){
  try {
    const blob = await getBlob(f);
    if (downloads){ await downloads.save({filename:f.name, data:blob}); return; }
    if (local){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = f.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return; }

/* ---------- Uploads ---------- */
const tray = {rows:[], el:$("#tray")};
function trayRender(){
  const rows = tray.rows, busy = rows.filter(r => r.state === "busy").length;
  tray.el.hidden = !rows.length; if (!rows.length) return;
  tray.el.innerHTML = `<div class="tray-h">${busy ? `Archiving ${busy} file${busy===1?"":"s"}…` : `${rows.filter(r=>r.state==="done").length} of ${rows.length} archived`}<button class="icon-btn" id="trayClose" aria-label="Close upload list">${ic("x")}</button></div>
    <ul>${rows.map(r => `<li>${r.state==="busy"?'<span class="spin"></span>':r.state==="done"?`<span class="ok">${ic("check")}</span>`:`<span class="bad">${ic("info")}</span>`}<div class="t"><b>${esc(r.name)}</b><small class="${r.state==="err"?"err":""}">${esc(r.msg)}</small></div></li>`).join("")}</ul>`;
  $("#trayClose").onclick = () => { tray.rows = tray.rows.filter(r => r.state === "busy"); trayRender(); };
}
const toB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("Couldn't read the file.")); r.readAsDataURL(file); });
let uploading = Promise.resolve();
function uploadFiles(files){
  if (!files.length) return;
  if (!canUpload()){ toast("Only people with edit access can add files."); return; }
  const folderId = S.view === "folder" ? S.folderId : null;
  const rows = files.map(f => ({name:f.name, state:"busy", msg:"Waiting…", file:f}));
  tray.rows.push(...rows); trayRender();
  uploading = uploading.then(async () => {
    for (const r of rows){
      const file = r.file, ext = extOf(file.name), info = EXT[ext];
      if (!info){ Object.assign(r, {state:"err", msg:`.${ext || "?"} files aren't supported yet`}); trayRender(); continue; }
      const max = info.max || (info.native ? 20*MB : 15*MB);
      if (file.size > max){ Object.assign(r, {state:"err", msg:`Over the ${fmtSize(max)} limit (${fmtSize(file.size)})`}); trayRender(); continue; }
      if (!file.size){ Object.assign(r, {state:"err", msg:"This file is empty"}); trayRender(); continue; }
      r.msg = `Uploading ${fmtSize(file.size)}…`; trayRender();
      try {
        const id = newId(), now = Date.now();
        const doc = {name:file.name, ext, kind:info.kind, mime:info.mime, size:file.size, assetId:null, wrapped:!info.native,
          folderId, tags:[], starred:false, note:"", by:me?.id || null, createdAt:now, updatedAt:now, trashed:false, acc:accession(id, now)};
        if (local){ doc.localBlob = file; doc.localUrl = URL.createObjectURL(file); doc.wrapped = false; }
        else if (info.native){ doc.assetId = (await assets.upload(file, {type:info.mime})).id; }
        else { const b64 = await toB64(file); doc.assetId = (await assets.upload(new Blob([b64], {type:"text/plain"}), {type:"text/plain"})).id; }
        await store.setFile(id, doc);
        Object.assign(r, {state:"done", msg:`${doc.acc} · ${folderOf(folderId)?.name || "All files"}`});
      } catch (e){ Object.assign(r, {state:"err", msg:failMsg(e)}); }
      trayRender();
    }
    const done = rows.filter(r => r.state === "done").length;
    if (done) setTimeout(() => { tray.rows = tray.rows.filter(r => !(r.state === "done" && rows.includes(r))); trayRender(); }, 5000);
  });
}
$("#fileInput").addEventListener("change", e => { uploadFiles([...e.target.files]); e.target.value = ""; });

function wireDetails(f){
  const nm = $("#vName");
  if (nm?.isContentEditable){
    nm.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); nm.blur(); } if (e.key === "Escape"){ nm.textContent = f.name; nm.blur(); e.stopPropagation(); } };
    nm.onblur = async () => {
      let v = nm.textContent.trim().replace(/[\\/]/g,"-"); if (!v || v === f.name){ nm.textContent = f.name; return; }
      if (!v.toLowerCase().endsWith("." + f.ext)) v += "." + f.ext;

}
$("#viewer").addEventListener("click", async e => {

function parseCSV(t, max = 500){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; if (rows.length >= max) break; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function tableHTML(rows){
  const w = Math.max(...rows.map(r => r.length));
  return `<div class="pv-table"><table><thead><tr><th class="rn">#</th>${Array.from({length:w},(_,i)=>`<th>${esc(rows[0]?.[i] ?? "")}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map((r,ri)=>`<tr><td class="rn">${ri+2}</td>${Array.from({length:w},(_,i)=>`<td>${esc(r[i] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function noPreview(f, why){

}
async function renderPreview(f, host){
  const tok = ++pvToken, alive = () => tok === pvToken && host.isConnected;
  host.innerHTML = `<div class="pv-loading"><span class="spin"></span>Opening ${esc(f.name)}…</div>`;
  try {
    if (f.kind === "image"){ host.innerHTML = `<img class="pv-img" src="${esc(blobUrl(f))}" alt="${esc(f.name)}">`; const im = host.querySelector("img"); im.onclick = () => im.classList.toggle("zoom"); im.onerror = () => host.innerHTML = noPreview(f, "This image couldn't be displayed."); return; }
    if (f.kind === "video"){ host.innerHTML = `<video class="pv-video" src="${esc(blobUrl(f))}" controls playsinline preload="metadata"></video>`; return; }
    if (f.kind === "pdf"){
      const pdfjs = await lib("pdf");
      const doc = await pdfjs.getDocument(f.localBlob ? {data:new Uint8Array(await f.localBlob.arrayBuffer()), isEvalSupported:false} : {url:blobUrl(f), isEvalSupported:false}).promise;
      if (!alive()) return;
      const n = Math.min(doc.numPages, 60);
      host.innerHTML = `<div class="pv-pages" id="pages"></div>${doc.numPages>60?`<p style="color:var(--muted);margin-top:14px">Showing the first 60 of ${doc.numPages} pages — download for the rest.</p>`:""}`;
      const wrap = host.querySelector("#pages"), width = Math.min(900, host.clientWidth - 8), dpr = Math.min(2, devicePixelRatio || 1);
      for (let i = 1; i <= n; i++){
        if (!alive()) return;
        const pg = await doc.getPage(i), vp0 = pg.getViewport({scale:1}), vp = pg.getViewport({scale:width/vp0.width*dpr});
        const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; cv.style.width = width + "px";
        cv.setAttribute("aria-label", `Page ${i}`); wrap.append(cv);
        await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
      }
      return;
    }
    const blob = await getBlob(f); if (!alive()) return;
    if (f.ext === "md"){
      const txt = await blob.text();
      try { const [m] = await Promise.all([lib("marked"), lib("purify")]); host.innerHTML = `<article class="pv-doc">${await clean(m.parse(txt))}</article>`; }
      catch { host.innerHTML = `<pre class="pv-pre">${esc(txt)}</pre>`; }
      return;
    }
    if (f.ext === "json"){ const txt = await blob.text(); let out = txt; try { out = JSON.stringify(JSON.parse(txt), null, 2); } catch {} host.innerHTML = `<pre class="pv-pre">${esc(out.slice(0, 400000))}</pre>`; return; }
    if (f.ext === "txt"){ host.innerHTML = `<pre class="pv-pre">${esc((await blob.text()).slice(0, 400000))}</pre>`; return; }
    if (f.ext === "csv"){ const rows = parseCSV(await blob.text()); host.innerHTML = rows.length ? tableHTML(rows) : noPreview(f, "This spreadsheet is empty."); return; }
    if (f.ext === "docx"){
      const [m] = await Promise.all([lib("mammoth"), lib("purify")]);
      const r = await m.convertToHtml({arrayBuffer: await blob.arrayBuffer()}); if (!alive()) return;
      host.innerHTML = `<article class="pv-doc">${await clean(r.value) || "<p><em>This document has no text.</em></p>"}</article>`; return;
    }
    if (f.ext === "xlsx"){
      const X = await lib("xlsx"); const wb = X.read(await blob.arrayBuffer(), {type:"array"}); if (!alive()) return;
      const show = name => {
        const rows = X.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:""}).slice(0, 500).map(r => r.map(String));
        host.innerHTML = `<div style="width:100%">${wb.SheetNames.length>1?`<div class="sheettabs">${wb.SheetNames.map(s=>`<button class="chip" data-sheet="${esc(s)}" aria-pressed="${s===name}">${esc(s)}</button>`).join("")}</div>`:""}${rows.length?tableHTML(rows):`<p style="color:var(--muted)">This sheet is empty.</p>`}</div>`;
        host.querySelectorAll("[data-sheet]").forEach(b => b.onclick = () => show(b.dataset.sheet));
      };
      show(wb.SheetNames[0]); return;
    }
    if (f.ext === "pptx"){
      const Z = await lib("jszip"); const zip = await Z.loadAsync(await blob.arrayBuffer());
      const names = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
      const slides = [];
      for (const n of names.slice(0, 80)){ const x = await zip.file(n).async("string"); const paras = x.split(/<\/a:p>/).map(p => [...p.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]).join("")).filter(Boolean); slides.push(paras); }
      if (!alive()) return;
      const dec = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
      host.innerHTML = slides.length ? `<div class="slides"><p style="color:var(--muted)">Text outline of ${slides.length} slide${slides.length===1?"":"s"} — download for the full design.</p>${slides.map((s,i)=>`<div class="slide"><b>${esc(dec(s[0]||"Untitled slide"))}</b>${s.slice(1,9).map(p=>`<p>${esc(dec(p))}</p>`).join("")}<span class="no">${i+1}</span></div>`).join("")}</div>` : noPreview(f, "No slide text to show.");
      return;
    }
    if (f.ext === "zip"){
      const Z = await lib("jszip"); const zip = await Z.loadAsync(await blob.arrayBuffer());
      const entries = Object.values(zip.files).filter(e => !e.dir);
      if (!alive()) return;
      host.innerHTML = `<div style="width:min(100%,760px)"><p style="color:var(--muted);margin-bottom:10px">${entries.length} file${entries.length===1?"":"s"} inside</p>${tableHTML([["Name","Size","Modified"], ...entries.slice(0,400).map(e => [e.name, fmtSize(e._data?.uncompressedSize || 0), e.date ? e.date.toLocaleDateString() : ""])])}</div>`;

  } catch (e){
    if (!alive()) return;
    host.innerHTML = noPreview(f, e?.code === "missing" ? "This file is missing from storage." : "The preview couldn't load here. You can still download the original.");
  }
}

  if (act === "star"){ e.stopPropagation(); toggleStar([id]); return; }
  if (act === "pick" || S.selected.size || e.shiftKey || e.metaKey || e.ctrlKey){
    e.stopPropagation(); S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
    document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.toggle("sel", S.selected.has(id)));
    renderBulk(); return;
  }
  openViewer(id);
});
$("#content").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-id]")){ e.preventDefault(); openViewer(e.target.dataset.id); } if ((e.key === "Enter" || e.key === " ") && e.target.matches('.dropzone[data-act="upload"]')){ e.preventDefault(); $("#fileInput").click(); } });
document.addEventListener("change", e => { if (e.target.id === "sortSel"){ S.sort = e.target.value; try { localStorage.setItem("arc.sort", S.sort); } catch {} render(); } });
$("#newFolderBtn").onclick = () => folderDialog();
$("#menuBtn").onclick = () => $("#app").classList.add("nav-open");
$("#scrim").onclick = () => $("#app").classList.remove("nav-open");
let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); S.selected.clear(); render(); }, 140); });
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input,textarea,select,[contenteditable='true']");
  if (!$("#modal").hidden){ if (e.key === "Escape"){ $("#modal").hidden = true; } return; }
  if (S.openId){
    if (e.key === "Escape" && !typing) closeViewer();
    if (!typing && e.key === "ArrowLeft") step(-1);
    if (!typing && e.key === "ArrowRight") step(1);
    return;
  }
  if (typing) { if (e.key === "Escape" && e.target.id === "q"){ e.target.value = ""; S.q = ""; render(); e.target.blur(); } return; }
  if (e.key === "/"){ e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && S.selected.size){ S.selected.clear(); render(); }
});

/* ---------- Drag & drop: upload from desktop, or move cards onto folders ---------- */
let dragDepth = 0; const drop = $("#drop");
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e) || !canUpload()) return; e.preventDefault(); dragDepth++; $("#dropWhere").textContent = S.view === "folder" ? `Files go to ${folderOf(S.folderId)?.name}` : "Files go to All files"; drop.hidden = false; });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
window.addEventListener("dragover", e => { if (hasFiles(e) && canUpload()) e.preventDefault(); });
window.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; drop.hidden = true; uploadFiles([...e.dataTransfer.files]); });
document.addEventListener("paste", e => { const files = [...(e.clipboardData?.files || [])]; if (files.length && !e.target.matches("input,textarea,[contenteditable='true']")){ e.preventDefault(); uploadFiles(files); } });
document.addEventListener("dragstart", e => {
  const card = e.target.closest?.("[data-id]"); if (!card || !canWrite) return;
  const ids = S.selected.has(card.dataset.id) ? [...S.selected] : [card.dataset.id];
  e.dataTransfer.setData("text/x-arc", JSON.stringify(ids)); e.dataTransfer.effectAllowed = "move"; card.classList.add("dragging");
});
document.addEventListener("dragend", e => e.target.closest?.("[data-id]")?.classList.remove("dragging"));
document.addEventListener("dragover", e => { const t = e.target.closest?.("[data-folder],[data-view='all']"); if (t && [...e.dataTransfer.types].includes("text/x-arc")){ e.preventDefault(); t.classList.add("drop-over"); } });
document.addEventListener("dragleave", e => e.target.closest?.("[data-folder],[data-view='all']")?.classList.remove("drop-over"));
document.addEventListener("drop", e => {
  const t = e.target.closest?.("[data-folder],[data-view='all']"); const raw = e.dataTransfer?.getData("text/x-arc");
  if (!t || !raw) return; e.preventDefault(); t.classList.remove("drop-over");
  moveFiles(JSON.parse(raw), t.dataset.folder || null);
});

/* ---------- Boot ---------- */
function showNotice(html){ const n = $("#notice"); n.innerHTML = ic("info") + `<div>${html}</div>`; n.hidden = false; }
function enterLocal(){
  local = true; canWrite = true; S.ready = true;
  showNotice("<b>Local mode.</b> Shared storage isn't available here, so files you add stay in this browser tab only and disappear when you close it. Open the published archive on claude.ai to share files with your team.");
  render();
}
async function boot(){
  render();
  const c = window.claude;
  if (!c?.use){ enterLocal(); return; }
  [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  if (!db){ enterLocal(); return; }
  [assets, downloads] = await Promise.all([c.use("assets"), c.use("downloads")]);
  if (user){
    me = await user.me();
    const cw = await user.can("data.write"); canWrite = cw !== false;
    const av = $("#me"); if (me?.avatarUrl){ av.innerHTML = ""; const img = document.createElement("img"); img.src = me.avatarUrl; img.alt = ""; av.append(img); av.title = me.name || "You"; }
  }
  if (!assets) showNotice(canWrite ? "You can browse, preview, tag and organise files. Adding or permanently deleting files needs <b>edit access</b> — ask the archive's owner." : "You have <b>view-only</b> access: browse, preview and download files. Ask the archive's owner for edit access to add files.");
  let got = 0; const ready = () => { if (++got >= 2 && !S.ready){ S.ready = true; } render(); };
  const onErr = e => { if (e?.code === "revoked") showNotice("Your access to this archive changed. Reload to continue."); };
  let seenF = false, seenD = false;
  db.collection("files").limit(1000).onSnapshot(s => {
    S.files = s.docs.map(d => ({id:d.id, ...d.data()}));
    const ids = new Set(S.files.map(f => f.id)); S.selected.forEach(id => { if (!ids.has(id)) S.selected.delete(id); });
    if (S.openId && !ids.has(S.openId)) closeViewer();
    if (!seenF){ seenF = true; ready(); } else render();
  }, onErr);
  db.collection("folders").onSnapshot(s => {
    S.folders = s.docs.map(d => ({id:d.id, ...d.data()}));
    if (S.view === "folder" && !folderOf(S.folderId) && seenD) go("all");
    if (!seenD){ seenD = true; ready(); } else render();
  }, onErr);
  if (assets) assets.list().then(r => { usage = r.usage; renderNav(); }).catch(() => {});
}
boot().catch(() => { if (!S.ready) enterLocal(); });
})();
</script>
